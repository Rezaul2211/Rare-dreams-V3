<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="6"/>
  
  <!-- Crown / Diamond Emblem -->
  <g transform="translate(256, 175)">
    <path d="M-60,35 L-85,-25 L-30,0 L0,-45 L30,0 L85,-25 L60,35 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="-55" r="7" fill="#FDE68A" />
    <circle cx="-90" cy="-32" r="6" fill="#FDE68A" />
    <circle cx="90" cy="-32" r="6" fill="#FDE68A" />
  </g>

  <!-- Typography RD & Rare Dreams -->
  <text x="256" y="325" font-family="'Playfair Display', Georgia, serif" font-size="110" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">RD</text>
  
  <!-- Subtitle -->
  <text x="256" y="380" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">RARE DREAMS</text>
  <text x="256" y="415" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#F59E0B" text-anchor="middle" letter-spacing="6">PREMIUM LIFESTYLE</text>
</svg>
